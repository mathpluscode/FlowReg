[project]
name = "flowreg"
version = "0.1.0"
description = "FlowReg"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.5",
    "scipy>=1.8.1",
    "SimpleITK>=2.0.2",
    "tqdm>=4.64.1",
    "einops>=0.4.1",
    "pyyaml>=6.0",
    "pandas>=1.5.0",
    "wandb>=0.15.0",
    "monai>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "data", "core"]
